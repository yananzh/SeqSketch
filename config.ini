# SeqSketch external tool paths
#
# Relative paths are resolved against the directory containing SeqSketch.exe
# (portable onedir installation) or the project root (development mode).
# Example: softwares/ncbi-blast-2.17.0+/bin
#          -> <app_root>/softwares/ncbi-blast-2.17.0+/bin
#
# To use a custom installation, replace the relative path with an absolute one.
#
[BLAST]
bin_dir = softwares/windows/ncbi-blast-2.17.0+/bin

[IQTree]
bin_dir = softwares/windows/iqtree-3.1.3-Windows/bin

[MAFFT]
bin_dir = softwares/windows/mafft-win_v7.526

[TrimAl]
bin_dir = softwares/windows/trimAl_Windows_v1.5.1

[MUSCLE]
exe = softwares/windows/muscle-win64.v5.3.exe

