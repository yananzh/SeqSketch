# SeqSketch external tool paths
#
# These entries are OPTIONAL overrides. Leave them commented out and SeqSketch
# resolves the bundled tool automatically for the current platform:
#
#   Windows   softwares/windows/<tool>/...
#   macOS     softwares/Mac/<tool>/...
#
# Relative paths are resolved against the directory containing SeqSketch.exe
# (portable onedir installation) or the project root (development mode).
#
# To use a custom installation, uncomment the key and give it a path — absolute,
# or relative to the app root. Examples:
#
#   [BLAST]
#   bin_dir = C:/tools/ncbi-blast-2.17.0+/bin     (Windows)
#   bin_dir = /usr/local/ncbi/blast/bin           (macOS)
#
# An empty value counts as "not configured" and falls back to the bundled copy.

[BLAST]
; bin_dir =

[IQTree]
; bin_dir =

[MAFFT]
; bin_dir =

[TrimAl]
; bin_dir =

[MUSCLE]
; exe =

